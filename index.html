<style>

<script>
// ===== 工具函数 =====
var ST=function(m,d){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show')},d||2500);};
var PK=function(a){return a[Math.floor(Math.random()*a.length)]};

// ===== 音频管理 =====
var audioContext = null;
var bgmAudio = null;
var currentAudio = null;

// 初始化音频上下文（微信兼容）
function initAudioContext(){
  if(audioContext)return;
  try{
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }catch(e){
    console.error('音频上下文初始化失败:',e);
  }
}

// 播放音频文件（使用正确的文件名）
function playAudio(filePath, volume=1.0, loop=false){
  if(!audioContext)initAudioContext();
  
  if(currentAudio){
    currentAudio.pause();
    currentAudio = null;
  }
  
  currentAudio = new Audio(filePath);
  currentAudio.volume = volume;
  currentAudio.loop = loop;
  currentAudio.play().catch(e=>console.error('播放失败:',e));
  
  return currentAudio;
}

// 停止所有音频
function stopAllAudio(){
  if(bgmAudio)bgmAudio.pause();
  if(currentAudio)currentAudio.pause();
  bgmAudio = null;
  currentAudio = null;
}

// ===== 密码验证 =====
var AUTH_KEY='stitch-auth';
var AUTH_PASSWORDS=['0118','1124'];

function initAuth(){
  if(localStorage.getItem(AUTH_KEY)==='true'){
    document.getElementById('authOverlay').style.display='none';
    document.getElementById('mainContent').style.opacity='1';
    initApp();
    return;
  }
  document.getElementById('authInput').focus();
}

function checkAuth(){
  var input=document.getElementById('authInput');
  var error=document.getElementById('authError');
  var password=input.value.trim();
  
  if(AUTH_PASSWORDS.indexOf(password)!==-1){
    localStorage.setItem(AUTH_KEY,'true');
    var overlay=document.getElementById('authOverlay');
    var mainContent=document.getElementById('mainContent');
    overlay.style.opacity='0';
    setTimeout(function(){overlay.style.display='none';mainContent.style.opacity='1'},500);
    initApp();
  }else{
    error.textContent='密码错误，再想想～';
    error.style.opacity='1';
    input.style.borderColor='#E74C3C';
    setTimeout(function(){input.style.borderColor='#E0E0E0'},1500);
  }
}

document.addEventListener('DOMContentLoaded',initAuth);

// ===== 初始化应用 =====
function initApp(){
  updateDay();
  updateQuote();
  init3D();
  initStarCanvas();
  unlockAudio();
  ST('欢迎来到史迪仔24Ai 💙');
}

// ===== 星光触控特效 =====
var starCanvas,starCtx;
var stars=[];
var lastStarTime=0;
var STAR_THROTTLE=100;

function initStarCanvas(){
  starCanvas=document.getElementById('starCanvas');
  starCtx=starCanvas.getContext('2d');
  resizeStarCanvas();
  window.addEventListener('resize',resizeStarCanvas);
  document.addEventListener('click',handleStarTouch,true);
  document.addEventListener('touchstart',handleStarTouch,true);
  requestAnimationFrame(animateStars);
}

function resizeStarCanvas(){
  starCanvas.width=window.innerWidth*window.devicePixelRatio;
  starCanvas.height=window.innerHeight*window.devicePixelRatio;
  starCtx.scale(window.devicePixelRatio,window.devicePixelRatio);
}

function handleStarTouch(e){
  var now=Date.now();
  if(now-lastStarTime<STAR_THROTTLE)return;
  lastStarTime=now;

  var x,y;
  if(e.touches&&e.touches.length>0){
    x=e.touches[0].clientX;
    y=e.touches[0].clientY;
  }else{
    x=e.clientX;
    y=e.clientY;
  }

  var count=10+Math.floor(Math.random()*6);
  for(var i=0;i<count;i++){
    var angle=(Math.PI*2/count)*i+Math.random()*0.5;
    var speed=1.5+Math.random()*2;
    stars.push({
      x:x,
      y:y,
      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed,
      size:3+Math.random()*4,
      alpha:1,
      life:800+Math.random()*400,
      born:now,
      color:Math.random()>0.5?'#FFD700':'#FFA500'
    });
  }
}

function animateStars(){
  requestAnimationFrame(animateStars);
  if(!starCtx)return;
  var now=Date.now();
  starCtx.clearRect(0,0,window.innerWidth,window.innerHeight);

  for(var i=stars.length-1;i>=0;i--){
    var s=stars[i];
    var age=now-s.born;
    if(age>s.life){
      stars.splice(i,1);
      continue;
    }
    s.x+=s.vx;
    s.y+=s.vy;
    s.alpha=1-age/s.life;
    s.size*=0.995;

    starCtx.save();
    starCtx.globalAlpha=s.alpha;
    starCtx.fillStyle=s.color;
    starCtx.beginPath();
    var r=s.size;
    for(var j=0;j<5;j++){
      var a1=(Math.PI*2/5)*j-Math.PI/2;
      var a2=a1+Math.PI/5;
      if(j===0)starCtx.moveTo(s.x+Math.cos(a1)*r,s.y+Math.sin(a1)*r);
      else starCtx.lineTo(s.x+Math.cos(a1)*r,s.y+Math.sin(a1)*r);
      starCtx.lineTo(s.x+Math.cos(a2)*r*0.5,s.y+Math.sin(a2)*r*0.5);
    }
    starCtx.closePath();
    starCtx.fill();
    starCtx.restore();
  }
}

// ===== 动态波浪背景 =====
(function(){
  var c=document.getElementById('bgCanvas'),ctx=c.getContext('2d');
  function r(){c.width=c.offsetWidth*window.devicePixelRatio;c.height=c.offsetHeight*window.devicePixelRatio;ctx.scale(window.devicePixelRatio,window.devicePixelRatio)}
  r();window.addEventListener('resize',r);
  var t=0;
  function d(){requestAnimationFrame(d);t+=0.008;var w=c.offsetWidth,h=c.offsetHeight;ctx.clearRect(0,0,w,h);
    for(var i=0;i<3;i++){ctx.beginPath();ctx.moveTo(0,h);for(var x=0;x<=w;x+=4){var y=h-70+Math.sin(x*0.008+t+i*1.2)*15+Math.sin(x*0.015+t*0.9+i*1.8)*8+Math.sin(x*0.002+t*0.5)*4;ctx.lineTo(x,y)}ctx.lineTo(w,h);ctx.closePath();ctx.fillStyle='rgba(255,138,92,'+(0.03+i*0.01)+')';ctx.fill()}
  }d();
})();

// ===== Three.js 3D模型 =====
var scene, camera, renderer, model;

function init3D(){
  var canvas=document.getElementById('modelCanvas');
  var fallbackImg=document.getElementById('fallbackImg');
  
  if(!window.WebGLRenderingContext){
    canvas.style.display='none';
    fallbackImg.style.display='block';
    return;
  }
  
  var testCanvas=document.createElement('canvas');
  var gl=testCanvas.getContext('webgl')||testCanvas.getContext('experimental-webgl');
  if(!gl){
    canvas.style.display='none';
    fallbackImg.style.display='block';
    return;
  }
  testCanvas=null;
  
  scene=new THREE.Scene();
  
  var pw=canvas.parentElement.clientWidth;
  var ph=canvas.parentElement.clientHeight;
  camera=new THREE.PerspectiveCamera(30,pw/ph,0.1,100);
  camera.position.set(0,1,5);
  
  renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true});
  renderer.setSize(pw,ph);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setClearColor(0x000000,0);
  
  var amb=new THREE.AmbientLight(0xffffff,0.7);
  scene.add(amb);
  var dl1=new THREE.DirectionalLight(0xffffff,0.8);
  dl1.position.set(3,6,4);
  scene.add(dl1);
  
  if(typeof THREE.GLTFLoader==='undefined'){
    canvas.style.display='none';
    fallbackImg.style.display='block';
    return;
  }
  
  var loader=new THREE.GLTFLoader();
  var timeout=setTimeout(function(){
    if(model)return;
    canvas.style.display='none';
    fallbackImg.style.display='block';
    if(renderer){renderer.dispose();renderer=null;}
  },10000);
  
  loader.load(
    'stitch-3d.glb',
    function(gltf){
      clearTimeout(timeout);
      model=gltf.scene;
      model.position.y=0;
      scene.add(model);
      canvas.style.display='block';
      fallbackImg.style.display='none';
    },
    function(){},
    function(err){
      clearTimeout(timeout);
      console.error('3D加载失败:',err);
      canvas.style.display='none';
      fallbackImg.style.display='block';
    }
  );
  
  (function animLoop(){
    requestAnimationFrame(animLoop);
    if(model){
      var t=Date.now()*0.001;
      model.position.y=Math.sin(t*0.8)*0.08;
      model.rotation.y=Math.sin(t*0.3)*0.08;
    }
    if(renderer&&scene&&camera)renderer.render(scene,camera);
  })();
}
